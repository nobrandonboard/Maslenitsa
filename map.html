<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake Pancake — Карта</title>
<link rel="stylesheet" href="style.css">
<style>
.mhead{text-align:center;padding:24px 16px 6px}
.mhead h1{font-size:28px;margin:6px 0 4px}
.mhead p{color:var(--muted);font-size:13px;margin:0}
.mchips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:14px 16px;max-width:960px;margin:0 auto}
.mchip{
  background:var(--card);border:1px solid #2c2c30;color:var(--muted);
  padding:8px 14px;border-radius:999px;cursor:pointer;font-size:13.5px;
  white-space:nowrap;transition:background-color .15s,color .15s,border-color .15s;
}
.mchip b{color:var(--amber);margin-left:5px}
.mchip:hover,.mchip.on{background:var(--amber);color:#151515;border-color:var(--amber);font-weight:600}
.mchip:hover b,.mchip.on b{color:#151515}
.mframe{width:calc(100% - 32px);max-width:1100px;height:72vh;min-height:420px;margin:6px auto 40px;
  border:1px solid #2c2c30;border-radius:14px;overflow:hidden;background:var(--card)}
.mframe iframe{width:100%;height:100%;border:0;display:block}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 28px}
</style>
</head>
<body>
<div class="mhead">
  <h1 id="mtitle">Карта стадионов</h1>
  <p id="msub">18 стадионов · 11 городов</p>
</div>
<div class="mchips" id="mchips"></div>
<div class="mframe"><iframe id="ymap" title="Яндекс.Карта" allowfullscreen></iframe></div>
<footer>Яндекс.Карты · Fake Pancake</footer>
<script>
(function(){
  var L=(new URLSearchParams(location.search).get("lang")||"ru");
  var T={
    ru:{title:"Карта стадионов",sub:"18 стадионов · 11 городов"},
    en:{title:"Stadium map",sub:"18 stadiums · 11 cities"},
    zh:{title:"球场地图",sub:"18 座球场 · 11 座城市"}
  };
  var t=T[L]||T.ru;
  document.documentElement.lang=L;
  document.getElementById("mtitle").textContent=t.title;
  document.getElementById("msub").textContent=t.sub;

  /* города — синхронно с MATCHES на главной: [имя для карты, метки на языках, число матчей] */
  var CITIES=[
    {q:"Красноярск",     n:{ru:"Красноярск",en:"Krasnoyarsk",zh:"克拉斯诺亚尔斯克"},   c:77},
    {q:"Москва",         n:{ru:"Москва",en:"Moscow",zh:"莫斯科"},                     c:9},
    {q:"Hua Hin",        n:{ru:"Хуа Хин",en:"Hua Hin",zh:"华欣"},                     c:5},
    {q:"Санкт-Петербург",n:{ru:"Санкт-Петербург",en:"Saint Petersburg",zh:"圣彼得堡"}, c:3},
    {q:"Томск",          n:{ru:"Томск",en:"Tomsk",zh:"托木斯克"},                     c:1},
    {q:"Phuket",         n:{ru:"Пхукет",en:"Phuket",zh:"普吉"},                       c:1},
    {q:"Бангкок",        n:{ru:"Бангкок",en:"Bangkok",zh:"曼谷"},                     c:1},
    {q:"Патумтани",      n:{ru:"Патумтани",en:"Pathum Thani",zh:"巴吞他尼"},          c:1},
    {q:"Тюмень",         n:{ru:"Тюмень",en:"Tyumen",zh:"秋明"},                       c:1},
    {q:"Черемхово",      n:{ru:"Черемхово",en:"Cheremkhovo",zh:"切列姆霍沃"},         c:1},
    {q:"Пхетчабури",     n:{ru:"Пхетчабури",en:"Phetchaburi",zh:"碧武里"},            c:1}
  ];

  var box=document.getElementById("mchips");
  var frame=document.getElementById("ymap");
  function url(q){return "https://yandex.ru/map-widget/v1/?text="+encodeURIComponent(q)+"&z=12";}

  function show(i){
    frame.src=url(CITIES[i].q);
    [].forEach.call(box.children,function(el,j){el.classList.toggle("on",j===i);});
  }

  CITIES.forEach(function(c,i){
    var b=document.createElement("button");
    b.className="mchip";
    b.innerHTML=(c.n[L]||c.n.en)+" <b>"+c.c+"</b>";
    b.addEventListener("click",function(){show(i);});
    box.appendChild(b);
  });

  show(0);
})();
</script>
<script src="script.js"></script>
</body>
</html>
